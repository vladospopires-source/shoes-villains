name: Баг-репорт (Bug)
description: Сообщить об ошибке или некорректном поведении в игре
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Что пошло не так?
      description: Краткое и понятное описание бага.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия / ветка / коммит
      placeholder: "например: main, v0.1.0"
